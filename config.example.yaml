# postings-qa configuration. Copy to config.yaml (or run `pqa init`).

search:
  keywords:
    - "QA Engineer"
    - "Data Analyst"
    - "Automation Engineer"
  location: "United States"
  max_age_days: 14          # only ask sites for postings this recent
  max_pages: 3              # result pages per keyword per source (10 jobs per page)
  fetch_descriptions: true  # open each job's detail page (slower, enables description QA)
  max_details: 60           # cap on detail fetches per source per run

sources:
  # --- Official / public APIs (default). No browser involved; each is one or a few requests per run.
  remotive: { enabled: true }                       # remote-jobs feed; optional `category: qa` (see remotive.com/api/remote-jobs/categories)
  greenhouse: { enabled: true, boards: [gitlab, stripe, airbnb] }   # Greenhouse board tokens: the slug in boards.greenhouse.io/<token>
  lever: { enabled: true, sites: [spotify, palantir] }             # Lever site slugs: jobs.lever.co/<site>; or a map {slug: Display Name}
  usajobs: { enabled: true }                        # needs env PQA_USAJOBS_KEY + PQA_USAJOBS_EMAIL (free: developer.usajobs.gov/apirequest)
  adzuna: { enabled: false, country: us }           # needs env PQA_ADZUNA_APP_ID + PQA_ADZUNA_APP_KEY; 250 calls/day; requires a "Jobs by Adzuna" label
  # --- Scrapers (opt-in). These read public pages that the sites' terms say not to scrape; read the
  # "Responsible use" section of the README before enabling. Need `uv sync --extra scrapers`.
  linkedin: { enabled: false }
  indeed: { enabled: false }
  glassdoor: { enabled: false }

browser:
  headed: false             # `pqa run --headed` overrides for one run
  profile_dir: ".browser-profile"
  delay_seconds: [1.5, 4.0] # random pause between page loads
  timeout_seconds: 30

qa:
  include_keywords:         # title must contain at least one (case-insensitive, fuzzy)
    - qa
    - quality
    - test
    - sdet
    - data analyst
    - data quality
    - automation
    - analytics
  exclude_keywords:         # title must contain none
    - senior
    - staff
    - principal
    - director
    - manager
    - lead
    - intern
    - clearance
  remote_ok: true           # remote jobs pass the location check regardless of location
  locations:                # substrings accepted for the location check (blank list = accept all)
    - "United States"
    - "US"
    - "USA"
    - ", "                  # "City, ST" pattern
    - " Area"               # "Greater Boston Area"
  max_age_days: 30
  min_description_chars: 200
  salary_bounds_usd_year: [20000, 500000]
  blocked_companies: []
  agency_patterns:          # regex, case-insensitive, matched against company name
    - "staffing"
    - "recruit"
    - "talent"
    - "consultants?$"
    - "solutions? inc"
  spam_patterns:            # regex, matched against description
    - "earn \\$?\\d+.*(per|a) (day|week)"
    - "no experience (needed|necessary|required)"
    - "unlimited (earning|income)"
    - "be your own boss"

storage:
  db_path: "data/jobs.db"

export:
  output_dir: "output"
  filename: "jobs-{date}.xlsx"
