[project]
name = "postings-qa"
version = "0.1.0"
description = "Job-postings pipeline: pulls listings from public job APIs, runs rule-based data-QA checks with auditable rejection reasons, keeps a deduplicated SQLite history, and exports Excel and Streamlit dashboards."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Sophana Sok" }]
keywords = ["data-quality", "job-postings", "etl", "streamlit", "openpyxl", "greenhouse", "lever", "remotive", "usajobs"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business",
    "Topic :: Software Development :: Quality Assurance",
]

dependencies = [
    "openpyxl>=3.1",
    "pyyaml>=6.0",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "python-dateutil>=2.9",
]

[project.optional-dependencies]
scrapers = [
    "playwright>=1.47",
]
ui = [
    "streamlit>=1.40",
    "pandas>=2.2",
    "ruamel.yaml>=0.18",
]

[project.urls]
Repository = "https://github.com/SophanaSok/postings-qa"

[project.scripts]
pqa = "postingsqa.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["postingsqa"]

[tool.pytest.ini_options]
testpaths = ["tests"]
