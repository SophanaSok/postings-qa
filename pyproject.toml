[project]
name = "job-posting-bot"
version = "0.1.0"
description = "Playwright bot that scrapes LinkedIn, Indeed and Glassdoor job listings, runs data-QA checks, and exports an Excel dashboard with charts."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Sophana Sok" }]
dependencies = [
    "playwright>=1.47",
    "openpyxl>=3.1",
    "pyyaml>=6.0",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "python-dateutil>=2.9",
]

[project.scripts]
jobbot = "jobbot.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jobbot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
